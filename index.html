<style>
/* Zodiaque & Décans — feuille de style */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
:root{
  --bg-deep:#0b0a1a; --bg-card:rgba(20,18,45,.75);
  /* Couleurs dépendant du mode (sombre par défaut ; mode clair plus bas) */
  --page-bg:radial-gradient(ellipse at 20% 30%,#1a1435 0%,#0b0a1a 60%,#05040c 100%); --html-bg:#05040c;
  --ov-03:rgba(255,255,255,.03); --ov-04:rgba(255,255,255,.04); --ov-05:rgba(255,255,255,.05); --ov-06:rgba(255,255,255,.06);
  --ov-08:rgba(255,255,255,.08); --ov-12:rgba(255,255,255,.12); --ov-15:rgba(255,255,255,.15); --ov-30:rgba(255,255,255,.3);
  --field-bg:rgba(10,8,25,.7); --scheme:dark; --on-gold:#1a1435; --on-purple:#0b0a1a; --purple-ink:#c4b0f0; --h1-mid:#f5e6b8;
  --modal-bg:linear-gradient(160deg,#1a1435,#0f0c24); --toast-bg:rgba(20,18,45,.95); --export-bg:#0b0a1a;
  --gold-bright:#e8c36a; --stars-opacity:.7; --stars2-opacity:.4;
  --star-5:#f8d677; --star-5-glow:0 0 8px rgba(248,214,119,.7); --star-4:#e8c269; --star-4-glow:0 0 5px rgba(232,194,105,.4);
  --star-3:#c1a057; --star-2:#957e50; --star-1:#71634b;
  --gold:#e8c36a; --purple:#9b7ede;
  --text:#f0eaff; --muted:#b8aed6;
  --glow:rgba(232,195,106,.25);
  --red:#ff5470; --green:#7de6a0;
  --transition-theme: .8s ease;
}
/* ---------- Mode clair ----------
   Mêmes variables, valeurs claires. --gold et --purple sont recalculés en JS (paintTheme) : couleur du signe
   assombrie pour rester lisible sur fond clair. La carte du ciel et l'animation de recherche restent nocturnes. */
:root[data-theme="light"]{
  --bg-deep:#f4f1fb; --bg-card:rgba(255,255,255,.82); --text:#1d1640; --muted:#5b5180;
  --red:#c8203f; --green:#1d8a4b;
  --page-bg:radial-gradient(ellipse at 20% 30%,#ffffff 0%,#f1edfb 55%,#e2d9f4 100%); --html-bg:#e2d9f4;
  --ov-03:rgba(40,28,90,.035); --ov-04:rgba(40,28,90,.045); --ov-05:rgba(40,28,90,.06); --ov-06:rgba(40,28,90,.08);
  --ov-08:rgba(40,28,90,.11); --ov-12:rgba(40,28,90,.14); --ov-15:rgba(40,28,90,.2); --ov-30:rgba(40,28,90,.3);
  --field-bg:#ffffff; --scheme:light; --on-gold:#ffffff; --on-purple:#ffffff; --purple-ink:#5a3fa8; --h1-mid:#b08a2e;
  --modal-bg:linear-gradient(160deg,#ffffff,#f1edfb); --toast-bg:rgba(255,255,255,.97); --export-bg:#f4f1fb;
  --stars-opacity:.35; --stars2-opacity:.2;
  --star-5:#b8860b; --star-5-glow:none; --star-4:#c49a3a; --star-4-glow:none;
  --star-3:#c9ae72; --star-2:#d6c6a0; --star-1:#e3d9c2;
}

/* Fond sous la page : évite un éclair blanc lors du défilement élastique sur mobile */
html{ background:var(--html-bg); }
body{
  min-height:100vh;
  background:var(--page-bg);
  display:flex; align-items:center; justify-content:center;
  padding:1.5rem; overflow-x:hidden; position:relative;
}
body::before, body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(2px 2px at 10% 20%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 25% 70%,var(--gold),transparent),
    radial-gradient(2px 2px at 40% 40%,#fff,transparent),
    radial-gradient(1px 1px at 55% 85%,var(--purple),transparent),
    radial-gradient(2.5px 2.5px at 70% 15%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 85% 60%,var(--gold),transparent),
    radial-gradient(1px 1px at 95% 30%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 15% 90%,var(--purple),transparent);
  background-size:250px 250px;
  animation:starDrift 120s linear infinite; opacity:var(--stars-opacity);
  transition:background-image var(--transition-theme);
}
body::after{ background-size:400px 400px; animation-duration:200s; animation-direction:reverse; opacity:var(--stars2-opacity); }
@keyframes starDrift{ from{background-position:0 0} to{background-position:500px 500px} }

.app{
  position:relative; z-index:2; width:100%; max-width:880px;
  background:var(--bg-card); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glow); border-radius:32px; padding:2.5rem 2rem;
  box-shadow:0 20px 40px rgba(0,0,0,.5), 0 0 80px rgba(155,126,222,.12);
  animation:fadeUp .8s cubic-bezier(.2,.8,.3,1);
  transition:border-color var(--transition-theme), box-shadow var(--transition-theme), max-width .5s ease;
}
@keyframes fadeUp{ from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:translateY(0)} }

/* HEADER */
.header{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.8rem; }
.header h1{
  font-size:1.75rem; font-weight:600; letter-spacing:.04em;
  background:linear-gradient(135deg,var(--gold),var(--h1-mid),var(--purple));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  display:flex; align-items:center; gap:.6rem;
  transition:background var(--transition-theme);
}
.sym, .sign-icon, .aff-sym, .modal-pair, .ruler-tag{ font-variant-emoji:text; }
.header h1 .sym{
  font-size:1.9rem; color:var(--gold); -webkit-text-fill-color:var(--gold);
  animation:spinSlow 20s linear infinite; display:inline-block;
  transition:color var(--transition-theme);
}
@keyframes spinSlow{ to{transform:rotate(360deg)} }

.langs{ display:flex; gap:.35rem; flex-wrap:wrap; }
.lang-btn{
  background:var(--ov-06); border:1px solid var(--ov-12);
  color:var(--muted); padding:.4rem .75rem; border-radius:999px;
  font-size:.8rem; font-weight:500; cursor:pointer;
  transition:all .25s ease;
}
.lang-btn:hover{ background:rgba(232,195,106,.15); color:var(--text); border-color:var(--gold); }
.lang-btn.active{ background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700; box-shadow:0 0 18px rgba(232,195,106,.4); }
.lang-btn:focus-visible, .btn-reveal:focus-visible, .btn-secondary:focus-visible, .aff-item:focus-visible{
  outline:2px solid var(--gold); outline-offset:3px;
}

/* INPUT */
.input-zone{
  display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-end;
  padding:1.25rem; margin-bottom:1rem;
  background:var(--ov-03); border-radius:20px;
  border:1px solid var(--ov-06);
}
.field{ display:flex; flex-direction:column; gap:.45rem; flex:1 1 220px; min-width:0; }
.field-time{ flex:0 1 180px; }
.field-name{ flex:1 1 100%; }
.input-zone label{ font-size:.88rem; color:var(--muted); font-weight:500; white-space:nowrap; }
.input-zone .opt{ font-weight:400; opacity:.7; }
.input-zone select{
  width:100%; background:var(--field-bg); border:1px solid var(--ov-15); border-radius:14px;
  padding:.85rem 1rem; color:var(--text); font-size:1rem; outline:none; color-scheme:var(--scheme);
}
.input-zone select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,195,106,.15); }
.field-place{ flex:1 1 220px; }
.input-zone input[type=date], .input-zone input[type=time], .input-zone input[type=text]{
  width:100%; background:var(--field-bg);
  border:1px solid var(--ov-15); border-radius:14px;
  padding:.85rem 1rem; color:var(--text); font-size:1rem;
  outline:none; transition:border .3s, box-shadow .3s; color-scheme:var(--scheme);
}
.input-zone input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,195,106,.15); }
.input-zone input.error{ border-color:var(--red); box-shadow:0 0 0 3px rgba(255,84,112,.15); }
.btn-reveal{
  background:linear-gradient(135deg,var(--gold),#d4a843); color:var(--on-gold);
  border:none; padding:.9rem 1.8rem; border-radius:14px;
  font-weight:700; font-size:.95rem; cursor:pointer;
  transition:transform .2s, box-shadow .3s, background var(--transition-theme);
  white-space:nowrap;
}
.btn-reveal:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(232,195,106,.35); }
.btn-reveal:active{ transform:translateY(0); }
.btn-reveal:disabled{ opacity:.5; cursor:wait; }

.error-msg{
  color:var(--red); font-size:.85rem; padding:.5rem 1rem;
  background:rgba(255,84,112,.1); border-radius:10px;
  border:1px solid rgba(255,84,112,.25); margin-bottom:1rem;
  animation:fadeIn .3s ease;
}
.error-msg.hidden{ display:none; }

/* ACTIONS SUR RÉSULTAT */
.result-actions{
  display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem;
  animation:fadeIn .4s ease;
}
.btn-secondary{
  background:var(--ov-05); border:1px solid var(--ov-15);
  color:var(--text); padding:.6rem 1.1rem; border-radius:12px;
  font-size:.85rem; font-weight:500; cursor:pointer;
  transition:all .25s ease;
  display:inline-flex; align-items:center; gap:.4rem;
}
.btn-secondary:hover{ background:rgba(232,195,106,.15); border-color:var(--gold); transform:translateY(-1px); }
.btn-secondary:disabled{ opacity:.6; cursor:wait; }

/* SEARCH OVERLAY */
.search-overlay{
  position:fixed; inset:0; z-index:100;
  background:radial-gradient(ellipse at center,#0d0a24 0%,#04030a 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2rem; transition:opacity .4s ease;
}
.search-overlay.hidden{ display:none; }
.search-overlay.fade-out{ opacity:0; }

.sky{
  position:relative; width:320px; height:320px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(155,126,222,.08) 0%,transparent 70%);
  box-shadow:0 0 60px rgba(155,126,222,.15);
}
.sky::before, .sky::after{
  content:''; position:absolute; border-radius:50%;
  border:1px solid rgba(232,195,106,.15); pointer-events:none;
}
.sky::before{ inset:10%; animation:spinSlow 30s linear infinite; }
.sky::after{ inset:25%; border-color:rgba(155,126,222,.2); animation:spinSlow 20s linear infinite reverse; }

.crosshair{
  position:absolute; left:50%; top:50%;
  width:44px; height:44px; transform:translate(-50%,-50%);
  pointer-events:none; z-index:5;
}
.crosshair::before, .crosshair::after{
  content:''; position:absolute; background:var(--gold-bright);
  box-shadow:0 0 8px var(--gold-bright);
}
.crosshair::before{ left:50%; top:0; width:1px; height:100%; transform:translateX(-50%); }
.crosshair::after{ top:50%; left:0; height:1px; width:100%; transform:translateY(-50%); }
.crosshair .dot{
  position:absolute; left:50%; top:50%; width:6px; height:6px;
  background:var(--gold-bright); border-radius:50%; transform:translate(-50%,-50%);
  box-shadow:0 0 12px var(--gold-bright);
}

.constellation{ position:absolute; inset:0; width:100%; height:100%; }
.const-star{ fill:#fff; opacity:0; animation:starFade .4s ease-out forwards; filter:drop-shadow(0 0 4px var(--gold-bright)); }
@keyframes starFade{ to{opacity:1} }
.const-line{
  stroke:var(--gold-bright); stroke-width:1.6; fill:none;
  stroke-dasharray:100; stroke-dashoffset:100;
  animation:drawLine .55s ease-out forwards;
  filter:drop-shadow(0 0 3px var(--gold-bright));
}
@keyframes drawLine{ to{stroke-dashoffset:0} }

.search-text{
  color:var(--gold-bright); font-size:1rem; letter-spacing:.15em;
  text-transform:uppercase; font-weight:500;
  animation:pulseText 1.4s ease-in-out infinite;
}
@keyframes pulseText{ 0%,100%{opacity:.5} 50%{opacity:1} }

/* RESULT */
.result{ animation:fadeIn .6s ease forwards; }
.result.hidden{ display:none; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(15px)} to{opacity:1; transform:translateY(0)} }

.card{
  background:var(--ov-04); border:1px solid var(--ov-08);
  border-radius:22px; padding:1.5rem 1.6rem; margin-bottom:1.1rem;
  position:relative; overflow:hidden;
  transition:border-color .3s, transform .3s;
}
.card:hover{ border-color:rgba(232,195,106,.3); transform:translateY(-2px); }
.card::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--purple),transparent);
  opacity:.6;
}
.card h3{
  font-size:.78rem; text-transform:uppercase; letter-spacing:.15em;
  color:var(--gold); font-weight:600; margin-bottom:1rem;
}

.sign-head{ display:flex; align-items:center; gap:1.2rem; margin-bottom:1rem; }

/* Titulaire du profil (affiché en tête de l'image exportée). Pas de texte en dégradé :
   html2canvas ne sait pas le rendre. */
.owner{ padding:0 .4rem 1rem; }
.owner-name{ font-size:1.6rem; font-weight:600; color:var(--text); line-height:1.25; overflow-wrap:anywhere; }
.owner-birth{ font-size:.9rem; color:var(--muted); margin-top:.2rem; }

.brand{ display:flex; flex-direction:column; gap:.3rem; min-width:0; }
.today{ color:var(--muted); font-size:.9rem; letter-spacing:.02em; }
.sign-icon{
  font-size:3.2rem; line-height:1; color:var(--gold);
  filter:drop-shadow(0 0 12px rgba(232,195,106,.4));
  animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{ filter:drop-shadow(0 0 12px rgba(232,195,106,.3)) }
  50%{ filter:drop-shadow(0 0 22px rgba(232,195,106,.7)) }
}
.sign-name{ font-size:1.9rem; font-weight:600; color:var(--text); line-height:1.2; }
.sign-meta{ font-size:.85rem; color:var(--gold); letter-spacing:.06em; text-transform:uppercase; margin-top:.2rem; }
.summary{ color:var(--muted); line-height:1.65; font-size:.98rem; }
.cusp-note{
  color:var(--text); font-size:.88rem; line-height:1.5;
  background:rgba(232,195,106,.08); border:1px solid rgba(232,195,106,.25);
  border-radius:12px; padding:.6rem .9rem; margin-bottom:1rem;
}

.info-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  gap:.7rem; margin-top:1.2rem; padding-top:1.2rem;
  border-top:1px dashed var(--ov-08);
}
.info-item{ display:flex; flex-direction:column; gap:.25rem; }
.info-label{ font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
.info-value{ color:var(--text); font-weight:600; font-size:.92rem; }
.info-value .swatch{
  display:inline-block; width:12px; height:12px; border-radius:50%;
  margin-right:4px; vertical-align:middle; border:1px solid var(--ov-30);
}

.duo{ display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }
.duo-block{ background:var(--ov-03); border-radius:16px; padding:1rem 1.2rem; }
.duo-block h4{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; margin-bottom:.7rem; }
.duo-block.strengths h4{ color:var(--green); }
.duo-block.weaknesses h4{ color:var(--red); }
.duo-block ul{ list-style:none; display:flex; flex-direction:column; gap:.4rem; }
.duo-block li{ color:var(--text); font-size:.9rem; display:flex; align-items:center; gap:.5rem; }
.duo-block.strengths li::before{ content:'▲'; color:var(--green); font-size:.65rem; }
.duo-block.weaknesses li::before{ content:'▼'; color:var(--red); font-size:.65rem; }

.duo-info{ display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }
.info-block{ padding:.4rem .2rem; }
.info-block .icon{ font-size:1.5rem; margin-bottom:.4rem; display:block; }
.info-block h4{ color:var(--gold); font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:.4rem; }
.info-block .text{ color:var(--muted); font-size:.9rem; line-height:1.55; }

.decan-badge{
  display:inline-flex; align-items:center; gap:.6rem;
  background:rgba(155,126,222,.15); border:1px solid rgba(155,126,222,.35);
  border-radius:999px; padding:.5rem 1.2rem;
  font-size:.9rem; font-weight:600; color:var(--purple-ink); margin-bottom:1rem;
}
/* Double fiche : occidental | chinois. Les 10 cartes sont dans une seule grille : sur grand écran,
   5 rangées × 2 colonnes (deux cartes d'une même rangée ont la même hauteur) ; sur petit écran,
   une colonne : les 5 cartes occidentales puis les 5 chinoises. */
.dual{ display:grid; gap:1.1rem; }
.dual > .card{ margin-bottom:0; }
@media (min-width:960px){
  .app.has-result{ max-width:1180px; }
  .dual{ grid-template-columns:1fr 1fr; grid-template-rows:repeat(5, auto); grid-auto-flow:column; }
}
/* Horoscope du jour (hors de l'image exportée) */
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.sky-card{ margin-top:1.1rem; }
.sky-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.8rem 1rem; margin-bottom:.4rem; }
.sky-head h3{ margin-bottom:0; }
.sky-controls{ display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; }
.sky-controls input[type=date]{
  background:var(--field-bg); border:1px solid var(--ov-15); border-radius:12px;
  padding:.5rem .8rem; color:var(--text); font-size:.9rem; color-scheme:var(--scheme); outline:none;
}
.sky-controls input[type=date]:focus{ border-color:var(--gold); }
.seg{ display:inline-flex; border:1px solid var(--ov-15); border-radius:12px; overflow:hidden; }
.seg button{ background:transparent; border:none; color:var(--muted); padding:.5rem .9rem; font-size:.85rem; cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--gold); color:var(--on-gold); font-weight:700; }
.seg button:focus-visible, .sky-controls input:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.sky-sub{ color:var(--text); font-size:.95rem; margin-bottom:.4rem; }
.sky-grid{ display:grid; gap:1.4rem; }
@media (min-width:960px){ .sky-grid{ grid-template-columns:minmax(0,2fr) minmax(0,1fr); } }
.sky-card h4{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); margin:1.1rem 0 .6rem; }
.transits{ list-style:none; display:flex; flex-direction:column; gap:.8rem; }
.transit{ display:flex; gap:.8rem; align-items:flex-start; }
.tr-sym{ font-size:1.3rem; color:var(--gold); width:1.6rem; text-align:center; flex:none; line-height:1.3; font-variant-emoji:text; }
.tr-head{ color:var(--text); font-size:.92rem; }
.tr-sign{ color:var(--gold); font-variant-emoji:text; }
.tr-aspect{ color:var(--muted); }
.tr-when{ color:var(--gold); font-size:.8rem; margin-left:.3rem; }
.transit p{ color:var(--muted); font-size:.88rem; line-height:1.55; margin-top:.15rem; }
.sky-none{ color:var(--muted); font-size:.92rem; margin-top:1rem; }
.positions{ list-style:none; display:flex; flex-direction:column; gap:.35rem; }
.positions li{ display:grid; grid-template-columns:1.4rem minmax(0,1fr) auto 1rem; gap:.5rem; align-items:center; font-size:.86rem; }
.pos-sym{ color:var(--gold); text-align:center; font-variant-emoji:text; }
.pos-name{ color:var(--text); }
.pos-sign{ color:var(--muted); white-space:nowrap; }
.pos-sign span{ color:var(--gold); font-variant-emoji:text; }
.pos-retro{ color:var(--red); font-weight:700; }
.moon-events{ list-style:none; display:flex; flex-direction:column; gap:.35rem; font-size:.86rem; color:var(--text); }
.sky-note{ color:var(--muted); font-size:.78rem; margin-top:1.2rem; opacity:.8; }

/* Carte du ciel */
.map-card{ margin-top:1.1rem; }
.sky-controls select{
  background:var(--field-bg); border:1px solid var(--ov-15); border-radius:12px;
  padding:.5rem .8rem; color:var(--text); font-size:.9rem; color-scheme:var(--scheme); max-width:16rem;
}
.sky-controls select:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.map-grid{ display:grid; gap:1.4rem; align-items:start; margin-top:.6rem; }
@media (min-width:960px){ .map-grid{ grid-template-columns:minmax(0,3fr) minmax(0,2fr); } }
.map-main{ display:flex; flex-direction:column; align-items:center; gap:.8rem; }
#skySvg{ width:100%; max-width:560px; height:auto; display:block; }
.sky-bg{ fill:#070616; stroke:rgba(255,255,255,.25); stroke-width:.4; }
#skySvg.daylight .sky-bg{ fill:#1b2748; }
#skySvg.daylight .st{ opacity:.2; }
.alt-ring{ fill:none; stroke:rgba(255,255,255,.08); stroke-width:.3; stroke-dasharray:1 1.5; }
.cl{ fill:none; stroke:rgba(155,126,222,.35); stroke-width:.35; }
.cl-zod{ stroke:rgba(232,195,106,.45); }
.cl-mine{ stroke:var(--gold-bright); stroke-width:.75; }
.ecl{ fill:none; stroke:var(--gold-bright); stroke-width:.3; stroke-dasharray:1.2 1.2; opacity:.5; }
.st-b{ fill:#cfe0ff; } .st-w{ fill:#ffffff; } .st-y{ fill:#fff1d0; } .st-o{ fill:#ffcf9e; }
.lbl{ fill:rgba(240,234,255,.55); font-size:3.6px; text-anchor:middle; }
.lbl-zod{ fill:rgba(232,195,106,.8); font-size:4px; }
.lbl-mine{ fill:var(--gold-bright); font-weight:700; }
.pl-dot{ stroke:#0b0a1a; stroke-width:.4; }
.pl-sun{ fill:#f8d677; } .pl-moon{ fill:#ececf4; } .pl-mercury{ fill:#bdbdbd; } .pl-venus{ fill:#f7f2de; }
.pl-mars{ fill:#ff7a5c; } .pl-jupiter{ fill:#e8c9a0; } .pl-saturn{ fill:#e6d48a; }
.pl-txt{ font-size:4.6px; fill:#f0eaff; font-variant-emoji:text; }
.radiant{ fill:#7de6a0; font-size:4.2px; text-anchor:middle; }
.dir{ fill:var(--muted); font-size:6px; text-anchor:middle; dominant-baseline:middle; }
.map-time{ display:flex; flex-wrap:wrap; align-items:center; gap:.4rem .8rem; width:100%; max-width:560px; }
.map-time label{ color:var(--muted); font-size:.82rem; }
.map-time input{ flex:1 1 180px; accent-color:var(--gold); }
.map-time output{ color:var(--text); font-size:.9rem; }
.map-side h4{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); margin:1.1rem 0 .6rem; }
.map-place{ color:var(--text); font-size:.92rem; line-height:1.5; }
.map-day{ color:var(--text); font-size:.86rem; background:rgba(232,195,106,.08); border:1px solid rgba(232,195,106,.25); border-radius:12px; padding:.5rem .8rem; margin-top:.8rem; }
.map-list{ list-style:none; display:flex; flex-direction:column; gap:.4rem; font-size:.88rem; color:var(--text); }
.map-list .sub, .map-place .sub{ color:var(--muted); }
.map-sym{ color:var(--gold); display:inline-block; width:1.2rem; text-align:center; font-variant-emoji:text; }

/* Compatibilité à deux */
.compat-card{ margin-top:1.1rem; }
.compat-form{ display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-end; }
.compat-form .field{ flex:1 1 200px; }
.compat-form .field-time{ flex:0 1 240px; }
.compat-form label{ font-size:.85rem; color:var(--muted); font-weight:500; }
.compat-form .opt{ font-weight:400; opacity:.7; }
.compat-form input{
  width:100%; background:var(--field-bg); border:1px solid var(--ov-15); border-radius:14px;
  padding:.75rem .9rem; color:var(--text); font-size:.95rem; outline:none; color-scheme:var(--scheme);
}
.compat-form input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,195,106,.15); }
.pair-error{ color:var(--red); font-size:.85rem; margin-top:.7rem; }
.pair-error.hidden{ display:none; }
.pair-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.8rem 1.4rem; margin:1.4rem 0 1rem; text-align:center; }
.pair-name{ font-size:1.25rem; font-weight:600; color:var(--text); overflow-wrap:anywhere; }
.pair-signs{ color:var(--gold); font-size:.9rem; margin-top:.2rem; font-variant-emoji:text; }
.pair-x{ font-size:1.6rem; color:var(--muted); }
.pair-global{ display:flex; flex-direction:column; align-items:center; gap:.3rem; text-align:center; margin-bottom:1.2rem; }
.pair-global .modal-stars, .pair-global .modal-level{ margin-bottom:0; }
.pair-global-label{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
.pair-score{ color:var(--text); font-weight:700; }
.pair-axes{ display:grid; gap:1rem; }
@media (min-width:960px){ .pair-axes{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
.pair-axis{ background:var(--ov-03); border:1px solid var(--ov-06); border-radius:16px; padding:1rem 1.1rem; }
.pair-axis h4{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); margin-bottom:.6rem; }
.pair-line{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:.4rem; color:var(--text); font-size:.9rem; margin-bottom:.5rem; font-variant-emoji:text; }
.pair-axis p{ color:var(--muted); font-size:.88rem; line-height:1.55; }
.pair-axis .modal-element{ margin-top:.7rem; }

/* Pied de l'image exportée */
.export-foot{ margin-top:1.2rem; text-align:right; color:var(--muted); font-size:.8rem; letter-spacing:.08em; }

/* Pendant la bascule clair / sombre, aucune transition (voir setMode) */
.theme-switching *, .theme-switching *::before, .theme-switching *::after{ transition:none !important; }

/* Bouton de mode clair / sombre */
.header-tools{ display:flex; flex-wrap:nowrap; align-items:flex-start; gap:.5rem; }
.header-tools .langs{ flex:1 1 auto; }
.theme-btn{ flex:none; }
.theme-btn{
  background:var(--ov-06); border:1px solid var(--ov-12); color:var(--text);
  width:2.2rem; height:2.2rem; border-radius:50%; cursor:pointer; font-size:1rem; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; transition:all .25s ease;
}
.theme-btn:hover{ border-color:var(--gold); }
.theme-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

/* Roue du zodiaque */
.wheel-wrap{ display:flex; flex-direction:column; align-items:center; gap:.4rem; margin:-.4rem 0 1.4rem; }
#wheel{ width:min(240px, 62vw); height:auto; display:block; transition:width .6s ease; }
.app.has-result #wheel{ width:150px; }
.w-outer{ fill:none; stroke:var(--glow); stroke-width:1; }
.w-inner{ fill:var(--ov-03); stroke:var(--ov-15); stroke-width:.6; }
.ws{ stroke:var(--ov-15); stroke-width:.6; transition:fill .6s ease; }
.ws-fire{ fill:rgba(255,107,107,.16); } .ws-earth{ fill:rgba(106,176,76,.16); }
.ws-air{ fill:rgba(249,202,36,.14); } .ws-water{ fill:rgba(72,201,176,.16); }
.ws.ws-mine{ fill:var(--gold); fill-opacity:.55; }
.wt{ stroke:var(--ov-30); stroke-width:.5; }
.wt-major{ stroke:var(--ov-30); stroke-width:.8; }
.wg{ fill:var(--text); font-size:13px; text-anchor:middle; dominant-baseline:central; font-variant-emoji:text; }
.wm-dot{ fill:var(--bg-deep); stroke:var(--gold); stroke-width:1; }
.wm{ fill:var(--gold); font-size:10px; text-anchor:middle; dominant-baseline:central; }
.wheel-caption{ color:var(--muted); font-size:.85rem; text-align:center; font-variant-emoji:text; }
.app.has-result .wheel-caption{ font-size:.8rem; }
@media (max-width:640px){ #wheel{ width:min(200px, 52vw); } .wheel-wrap{ margin:0 0 1.1rem; } }

/* Historique des recherches */
.history{ display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; margin:-.2rem 0 1rem; }
.history[hidden]{ display:none; }
.history-label{ color:var(--muted); font-size:.8rem; margin-right:.2rem; }
.history-chip{
  background:var(--ov-05); border:1px solid var(--ov-12); color:var(--text);
  border-radius:999px; padding:.35rem .8rem; font-size:.8rem; cursor:pointer; font-variant-emoji:text;
  transition:border-color .2s ease, background .2s ease;
}
.history-chip:hover{ border-color:var(--gold); }
.history-chip span{ color:var(--gold); }
.history-clear{ background:none; border:none; color:var(--muted); font-size:.78rem; text-decoration:underline; cursor:pointer; padding:.3rem; }
.history-chip:focus-visible, .history-clear:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

/* Pied de page : version hors ligne */
.app-foot{ margin-top:2rem; padding-top:1.2rem; border-top:1px dashed var(--ov-12); display:flex; flex-wrap:wrap; align-items:center; gap:.4rem 1rem; }
.offline-btn{
  background:none; border:1px solid var(--ov-15); color:var(--text); border-radius:999px;
  padding:.45rem 1rem; font-size:.85rem; cursor:pointer; transition:border-color .2s ease;
}
.offline-btn:hover{ border-color:var(--gold); }
.offline-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
.offline-hint{ color:var(--muted); font-size:.8rem; flex:1 1 260px; }

/* Onglets du résultat */
.view-tabs{ display:inline-flex; border:1px solid var(--ov-15); border-radius:14px; overflow:hidden; margin-bottom:1rem; max-width:100%; }
.view-tabs button{ background:transparent; border:none; color:var(--muted); padding:.6rem 1.1rem; font-size:.9rem; cursor:pointer; }
.view-tabs button[aria-selected="true"]{ background:var(--gold); color:var(--on-gold); font-weight:700; }
.view-tabs button:focus-visible{ outline:2px solid var(--gold); outline-offset:-3px; }
.dual[hidden], .natal[hidden]{ display:none; }

/* Thème natal */
.natal{ display:grid; gap:1.1rem; }
.natal > .card{ margin-bottom:0; }
.big-three{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; }
.big-chip{ display:flex; align-items:center; gap:.5rem; background:var(--ov-04); border:1px solid var(--ov-12); border-radius:999px; padding:.45rem 1rem; }
.big-sym{ color:var(--gold); font-weight:700; font-variant-emoji:text; }
.big-label{ color:var(--muted); font-size:.85rem; }
.big-sign{ color:var(--text); font-weight:600; font-variant-emoji:text; }
.big-sign span, .nl-head span, .natal-table td span, .natal-asc h4 span{ color:var(--gold); }
.natal-note{ color:var(--muted); font-size:.85rem; line-height:1.5; margin-bottom:.5rem; }
.natal-grid{ display:grid; gap:1.4rem; align-items:start; margin-top:.8rem; }
@media (min-width:960px){ .natal-grid{ grid-template-columns:minmax(0,3fr) minmax(0,2fr); } }
.natal-wheel{ display:flex; justify-content:center; }
.natal-svg{ width:100%; max-width:480px; height:auto; display:block; }
.natal-svg .ws{ stroke:var(--ov-15); stroke-width:.6; }
.nw-sign{ fill:var(--text); font-size:13px; text-anchor:middle; dominant-baseline:central; font-variant-emoji:text; }
.nw-tick{ stroke:var(--ov-30); stroke-width:.4; }
.nw-ring{ fill:none; stroke:var(--ov-15); stroke-width:.6; }
.nw-house{ stroke:var(--ov-30); stroke-width:.6; }
.nw-axis{ stroke:var(--gold); stroke-width:1.2; }
.nw-num{ fill:var(--muted); font-size:7px; text-anchor:middle; dominant-baseline:central; }
.nw-axis-lab{ fill:var(--gold); font-size:8px; font-weight:700; text-anchor:middle; dominant-baseline:central; }
.nw-asp{ stroke-width:.7; opacity:.8; }
.nw-harm{ stroke:#4a9fd8; } .nw-tense{ stroke:var(--red); }
.nw-ptick{ stroke:var(--gold); stroke-width:.8; }
.nw-planet{ fill:var(--gold); font-size:13px; text-anchor:middle; dominant-baseline:central; font-variant-emoji:text; }
.natal-table h4, .natal-asc h4{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); margin:.2rem 0 .6rem; }
.natal-table table{ width:100%; border-collapse:collapse; font-size:.88rem; color:var(--text); }
.natal-table td{ padding:.32rem .3rem; border-bottom:1px dashed var(--ov-08); font-variant-emoji:text; }
.nt-sym{ color:var(--gold); text-align:center; width:1.6rem; }
.nt-retro{ color:var(--red); font-weight:700; text-align:right; }
.nt-angle td{ font-weight:600; }
.natal-table th{ font-size:.68rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding:0 .3rem .3rem; }
.nt-sign{ white-space:nowrap; }
.nt-deg{ display:inline-block; white-space:nowrap; color:var(--muted); }
.nt-house{ text-align:center; width:3.6rem; }
.big-chip{ white-space:nowrap; }
@media (max-width:640px){
  .natal-main{ padding-left:.9rem; padding-right:.9rem; }
  .natal-table table{ font-size:.82rem; }
  .natal-table td{ padding:.3rem .2rem; }
  .nt-house{ width:auto; }
  .nw-sign{ font-size:14px; } .nw-planet{ font-size:15px; } .nw-num{ font-size:9px; } .nw-axis-lab{ font-size:10px; }
}
.natal-legend{ color:var(--muted); font-size:.85rem; font-style:italic; margin-bottom:1rem; }
.natal-asc{ margin-bottom:1rem; }
.natal-asc p{ color:var(--text); font-size:.92rem; line-height:1.6; margin-bottom:.8rem; }
.natal-lines, .natal-asp-list{ list-style:none; display:grid; gap:.9rem; }
@media (min-width:960px){ .natal-lines, .natal-asp-list{ grid-template-columns:1fr 1fr; } }
.nl-head{ color:var(--text); font-size:.92rem; font-variant-emoji:text; }
.nl-sym{ color:var(--gold); }
.natal-lines p{ color:var(--muted); font-size:.86rem; line-height:1.55; margin-top:.2rem; }
.natal-asp-list li{ display:flex; flex-direction:column; gap:.15rem; }
.na-pair{ color:var(--text); font-size:.9rem; font-variant-emoji:text; }
.na-sym{ color:var(--gold); font-weight:700; margin:0 .2rem; }
.na-type{ color:var(--gold); font-size:.8rem; }
.na-mean{ color:var(--muted); font-size:.84rem; }

.aff-hint{ font-size:.8rem; color:var(--muted); margin-bottom:.9rem; }
.decan-badge .cn-num{ font-size:.85rem; font-weight:700; }
.cn-note{ color:var(--muted); font-size:.85rem; line-height:1.5; margin-top:.9rem; }
.cn-hour{ margin-top:.9rem; padding-top:.9rem; border-top:1px dashed var(--ov-08); display:flex; flex-direction:column; gap:.3rem; }
.cn-hour p{ color:var(--muted); font-size:.85rem; line-height:1.5; }

.decan-badge .num{
  background:var(--purple); color:var(--on-purple); border-radius:50%;
  width:1.5rem; height:1.5rem; display:inline-flex;
  align-items:center; justify-content:center;
  font-size:.8rem; font-weight:800;
}
.decan-desc{ color:var(--muted); font-size:.95rem; line-height:1.6; margin-bottom:.8rem; font-style:italic; padding-left:.8rem; border-left:2px solid var(--purple); }
.traits{ display:flex; flex-wrap:wrap; gap:.5rem; }
.trait-tag{
  background:rgba(232,195,106,.1); border:1px solid rgba(232,195,106,.25);
  color:var(--gold); padding:.35rem .9rem; border-radius:999px;
  font-size:.82rem; font-weight:500;
}
.trait-tag.ruler-tag{ background:rgba(155,126,222,.15); border-color:rgba(155,126,222,.35); color:var(--purple-ink); }

.affinity-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:.7rem;
}
.aff-item{
  background:var(--ov-03); border:1px solid var(--ov-06);
  border-radius:14px; padding:.7rem .85rem;
  display:flex; flex-direction:column; gap:.35rem;
  transition:border-color .25s, transform .25s;
  cursor:pointer;
}
.aff-item:hover{ border-color:rgba(232,195,106,.35); transform:translateY(-2px); }
.aff-top{ display:flex; align-items:center; gap:.5rem; }
.aff-sym{ font-size:1.15rem; color:var(--gold); }
.aff-name{ font-size:.85rem; color:var(--text); font-weight:600; }
.aff-stars{ font-size:.95rem; letter-spacing:.1em; }
/* Jauge d'affinité : or fixe (indépendant du thème du signe), de plus en plus terne vers 1 */
.star-5{ color:var(--star-5); text-shadow:var(--star-5-glow); }
.star-4{ color:var(--star-4); text-shadow:var(--star-4-glow); }
.star-3{ color:var(--star-3); }
.star-2{ color:var(--star-2); }
.star-1{ color:var(--star-1); }
.star-empty{ color:var(--ov-12); }

/* MODAL */
.modal-overlay{
  position:fixed; inset:0; z-index:200;
  background:rgba(5,4,12,.75); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center; padding:1rem;
  animation:fadeIn .25s ease;
}
.modal-overlay.hidden{ display:none; }
.modal{
  background:var(--modal-bg);
  border:1px solid var(--glow); border-radius:24px;
  padding:2rem; max-width:460px; width:100%;
  box-shadow:0 30px 60px rgba(0,0,0,.6), 0 0 80px rgba(155,126,222,.15);
  position:relative;
  animation:modalIn .35s cubic-bezier(.2,.8,.3,1);
}
@keyframes modalIn{ from{opacity:0; transform:scale(.92) translateY(10px)} to{opacity:1; transform:scale(1) translateY(0)} }
.modal-close{
  position:absolute; top:.9rem; right:.9rem;
  background:var(--ov-06); border:1px solid var(--ov-15);
  color:var(--text); width:32px; height:32px; border-radius:50%;
  cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
  transition:all .2s ease;
}
.modal-close:hover{ background:rgba(255,84,112,.2); border-color:var(--red); }
.modal-pair{
  display:flex; align-items:center; justify-content:center; gap:1rem;
  font-size:2.5rem; margin-bottom:1rem; color:var(--gold);
}
.modal-pair .plus{ font-size:1.2rem; color:var(--muted); }
.modal h3{ text-align:center; font-size:1.25rem; margin-bottom:.5rem; color:var(--text); }
.modal-stars{ text-align:center; font-size:1.4rem; letter-spacing:.15em; margin-bottom:1.2rem; }
.modal-level{ text-align:center; font-size:.85rem; color:var(--gold); text-transform:uppercase; letter-spacing:.1em; margin-bottom:1.2rem; }
.modal-body{ color:var(--muted); font-size:.95rem; line-height:1.65; }
.modal-body p{ margin-bottom:.8rem; }
.modal-element{
  display:inline-block; background:rgba(155,126,222,.15);
  border:1px solid rgba(155,126,222,.35);
  color:var(--purple-ink); font-size:.8rem; padding:.35rem .9rem;
  border-radius:999px; margin-top:.5rem;
}

/* TOAST */
.toast{
  position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
  background:var(--toast-bg); border:1px solid var(--gold);
  color:var(--text); padding:.9rem 1.5rem; border-radius:14px;
  font-size:.9rem; z-index:300; box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:toastIn .4s cubic-bezier(.2,.8,.3,1);
}
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,20px)} to{opacity:1; transform:translate(-50%,0)} }

/* ACCESSIBILITÉ */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  body::before, body::after{ animation:none; }
}

@media (max-width:640px){
  .app{ padding:1.8rem 1.2rem; border-radius:24px; }
  .header{ flex-direction:column; align-items:flex-start; }
  .header h1{ font-size:1.45rem; }
  .input-zone{ flex-direction:column; align-items:stretch; }
  .field, .field-time{ flex:none; }
  .duo, .duo-info{ grid-template-columns:1fr; }
  .sign-head{ flex-direction:column; align-items:flex-start; gap:.6rem; }
  .sign-name{ font-size:1.6rem; }
  .sky{ width:260px; height:260px; }
}

<script type="text/x-zodiac-tests" id="zodiacTests">
/* ============================================================
   Zodiaque & Décans — suite de tests
   Utilisation : placer ce fichier à côté de ZODIAC.html, puis ouvrir ZODIAC.html?test
   Le rapport s'affiche en bas à droite de la page (et dans la console).
   Les valeurs de référence astronomiques viennent d'astropy (bibliothèque d'astronomie
   indépendante) : la formule du fichier n'est donc pas testée contre elle-même.
   ============================================================ */
(function(){
  const results = [];
  let group = '';
  function section(name){ group = name; }
  function test(name, fn){
    try { fn(); results.push({ group, name, ok: true }); }
    catch (e) { results.push({ group, name, ok: false, info: e.message }); }
  }
  function assert(cond, msg){ if (!cond) throw new Error(msg); }
  function assertEq(got, exp, msg){ if (got !== exp) throw new Error(`${msg} : obtenu ${got}, attendu ${exp}`); }
  const angleDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
  const utc = iso => new Date(iso.replace('Z', ':00Z')).getTime();

  /* Longitudes du Soleil calculées par astropy (instant UTC, degrés) — 40 instants de 1900 à 2100 */
  const SUN_REF = [
    ["1900-03-14T19:26Z", 353.78],
    ["1905-03-28T13:53Z", 7.2178],
    ["1910-05-31T04:49Z", 68.8503],
    ["1915-04-12T16:26Z", 21.6837],
    ["1920-05-20T06:43Z", 58.9325],
    ["1925-12-17T01:48Z", 264.6187],
    ["1930-10-24T06:56Z", 210.146],
    ["1935-12-24T10:27Z", 271.6919],
    ["1941-06-24T09:49Z", 92.476],
    ["1946-02-25T07:14Z", 336.0862],
    ["1951-05-11T20:48Z", 50.3469],
    ["1956-08-16T07:44Z", 143.4032],
    ["1961-12-22T00:17Z", 269.914],
    ["1967-01-10T09:49Z", 289.4611],
    ["1972-05-16T00:13Z", 55.2348],
    ["1977-01-31T09:21Z", 311.3997],
    ["1982-07-06T23:02Z", 104.5286],
    ["1987-09-05T06:25Z", 162.1726],
    ["1992-10-04T11:17Z", 191.484],
    ["1997-08-31T12:09Z", 158.1209],
    ["2003-04-27T04:20Z", 36.5097],
    ["2008-01-18T01:49Z", 297.3327],
    ["2013-08-06T09:53Z", 134.1035],
    ["2018-05-08T06:24Z", 47.6213],
    ["2023-06-22T11:34Z", 90.8198],
    ["2028-09-06T17:24Z", 164.6379],
    ["2033-10-29T23:55Z", 216.8772],
    ["2039-04-05T19:46Z", 15.8826],
    ["2044-06-05T04:14Z", 75.1666],
    ["2049-08-02T03:34Z", 130.3155],
    ["2054-06-26T14:11Z", 95.2223],
    ["2059-08-25T05:27Z", 152.0652],
    ["2064-10-10T19:36Z", 198.299],
    ["2069-10-29T14:51Z", 216.7751],
    ["2075-04-08T10:20Z", 18.7247],
    ["2080-07-26T10:22Z", 124.3734],
    ["2085-05-06T13:32Z", 46.7476],
    ["2090-08-12T09:31Z", 140.2156],
    ["2095-10-21T03:16Z", 208.0127],
    ["2100-11-19T21:50Z", 237.6312]
  ];
  /* Instant UTC (midi) → signe et décan attendus, d'après astropy (cas à plus de 0,6° d'une limite) */
  const SIGN_CASES = [
    ["1990-05-15T12:00Z", "taurus", 3],
    ["2000-12-25T12:00Z", "capricorn", 1],
    ["1985-08-10T12:00Z", "leo", 2],
    ["1970-03-25T12:00Z", "aries", 1],
    ["1990-01-19T12:00Z", "capricorn", 3],
    ["1990-01-21T12:00Z", "aquarius", 1],
    ["1990-03-21T12:00Z", "aries", 1],
    ["1978-07-05T12:00Z", "cancer", 2],
    ["1995-10-20T12:00Z", "libra", 3],
    ["1990-04-15T12:00Z", "aries", 3],
    ["2050-11-30T12:00Z", "sagittarius", 1],
    ["1923-09-01T12:00Z", "virgo", 1]
  ];

  /* ---------------- Calcul astronomique ---------------- */
  section('Calcul astronomique');
  test('Longitude du Soleil à ±0,02° d’astropy sur 40 instants (1900-2100)', () => {
    let worst = 0, at = '';
    for (const [iso, ref] of SUN_REF) { const d = angleDiff(sunLongitude(utc(iso)), ref); if (d > worst) { worst = d; at = iso; } }
    assert(worst < 0.02, `écart maximal ${worst.toFixed(4)}° le ${at}`);
  });
  test('Équinoxes et entrées dans un signe connues', () => {
    for (const [iso, target, label] of [['2024-03-20T03:06Z', 0, 'équinoxe 2024'], ['2000-03-20T07:35Z', 0, 'équinoxe 2000'],
      ['1990-12-22T03:06Z', 270, 'Capricorne 1990'], ['1990-01-20T08:01Z', 300, 'Verseau 1990']]) {
      const d = angleDiff(sunLongitude(utc(iso)), target);
      assert(d < 0.02, `${label} : écart ${d.toFixed(4)}°`);
    }
  });
  test(`Signe et décan sur ${SIGN_CASES.length} dates de référence`, () => {
    for (const [iso, sign, decan] of SIGN_CASES) {
      const lon = sunLongitude(utc(iso));
      assert(signFromLongitude(lon) === sign && decanFromLongitude(lon) + 1 === decan,
        `${iso} : ${signFromLongitude(lon)} décan ${decanFromLongitude(lon) + 1}, attendu ${sign} décan ${decan}`);
    }
  });
  test('Le 20 mars 2024 à midi est en Bélier (l’ancienne table fixe disait Poissons)', () => {
    assert(signFromLongitude(sunLongitude(utc('2024-03-20T12:00Z'))) === 'aries', 'pas Bélier');
  });

  /* Les tests suivants passent par l'heure locale : ils sont écrits pour réussir quel que soit le fuseau */
  const localParts = ms => { const d = new Date(ms); return [{ y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() }, { h: d.getHours(), min: d.getMinutes() }]; };
  test('Jour de changement de signe sans heure → alerte « signe »', () => {
    const [date] = localParts(utc('1990-12-22T03:06Z'));
    assert(computeSky(date, null).cusp === 'sign', `cusp = ${computeSky(date, null).cusp}`);
  });
  test('Jour de changement de décan sans heure → alerte « décan »', () => {
    const [date] = localParts(utc('1990-12-31T22:41Z'));
    assert(computeSky(date, null).cusp === 'decan', `cusp = ${computeSky(date, null).cusp}`);
  });
  test('Jour ordinaire → aucune alerte', () => {
    const [date] = localParts(utc('1990-12-26T12:00Z'));
    assert(computeSky(date, null).cusp === null, `cusp = ${computeSky(date, null).cusp}`);
  });
  test('L’heure de naissance tranche le jour de transition', () => {
    const ingress = utc('1990-12-22T03:06Z');
    const before = computeSky(...localParts(ingress - 2 * 3600e3));
    const after = computeSky(...localParts(ingress + 2 * 3600e3));
    assert(before.sign === 'sagittarius' && after.sign === 'capricorn', `${before.sign} → ${after.sign}`);
    assert(before.cusp === null && after.cusp === null, 'alerte affichée alors que l’heure est connue');
  });
  test('Affichage de la position : minutes avec heure, « ≈ » sans heure', () => {
    const date = { y: 1990, m: 4, d: 15 };
    assert(/^\d+°\d{2}′/.test(formatSunPosition(computeSky(date, { h: 10, min: 30 }))), 'format avec heure');
    assert(/^≈ \d+°/.test(formatSunPosition(computeSky(date, null))), 'format sans heure');
  });

  /* ---------------- Saisie ---------------- */
  section('Saisie');
  test('parseISODate accepte les vraies dates et refuse les autres', () => {
    for (const [v, ok] of [['2024-02-29', true], ['2023-02-29', false], ['1990-13-01', false], ['1990-04-31', false],
      ['abc', false], ['', false], [null, false], ['0050-06-15', true], ['1990-1-5', false]])
      assert(!!parseISODate(v) === ok, `parseISODate(${v}) devrait être ${ok}`);
  });
  test('parseTime accepte HH:MM et HH:MM:SS, refuse le reste', () => {
    for (const [v, ok] of [['09:05', true], ['23:59', true], ['12:30:15', true], ['24:00', false], ['12:60', false], ['9:05', false], ['', false], [null, false]])
      assert(!!parseTime(v) === ok, `parseTime(${v}) devrait être ${ok}`);
  });

  /* ---------------- Décans ---------------- */
  section('Décans');
  test('Planètes des décans (système des triplicités)', () => {
    const expected = { aries: ['mars','sun','jupiter'], taurus: ['venus','mercury','saturn'], cancer: ['moon','pluto','neptune'],
      libra: ['venus','uranus','mercury'], capricorn: ['saturn','venus','mercury'], pisces: ['neptune','moon','pluto'] };
    for (const k in expected) for (let i = 0; i < 3; i++)
      assert(decanRuler(k, i) === expected[k][i], `${k} décan ${i + 1} : ${decanRuler(k, i)}, attendu ${expected[k][i]}`);
  });
  test('Les 3 planètes d’un signe appartiennent à des signes du même élément', () => {
    for (const k of SIGN_ORDER) for (let i = 0; i < 3; i++) {
      const owner = SIGN_ORDER[(SIGN_ORDER.indexOf(k) + 4 * i) % 12];
      assert(SIGN_META[owner].element === SIGN_META[k].element, `${k} décan ${i + 1}`);
    }
  });

  /* ---------------- Compatibilité ---------------- */
  section('Compatibilité');
  test('Matrice d’affinités symétrique, scores entiers de 1 à 5', () => {
    for (const a of SIGN_ORDER) for (const b of SIGN_ORDER) {
      assert(AFF[a][b] === AFF[b][a], `${a}/${b} asymétrique`);
      assert(Number.isInteger(AFF[a][b]) && AFF[a][b] >= 1 && AFF[a][b] <= 5, `${a}/${b} hors 1-5`);
    }
  });
  test('Les 144 paires ont un texte de niveau et d’éléments, dans les 7 langues', () => {
    for (const l in I18N) for (const a of SIGN_ORDER) for (const b of SIGN_ORDER) {
      assert(I18N[l].compat.pairs[compatKey(SIGN_META[a].element, SIGN_META[b].element)], `${l} ${a}+${b} : texte d’éléments`);
      assert(I18N[l].compat.levels[AFF[a][b]], `${l} ${a}+${b} : texte de niveau`);
    }
  });
  test('Étoiles : n étoiles dorées de classe star-n, puis des étoiles vides', () => {
    for (let n = 1; n <= 5; n++) {
      const html = starHtml(n);
      assert((html.match(new RegExp(`star-${n}"`, 'g')) || []).length === n, `score ${n}`);
      assert((html.match(/star-empty/g) || []).length === 5 - n, `vides pour ${n}`);
    }
  });

  /* ---------------- Traductions ---------------- */
  section('Traductions');
  function sameShape(a, b, path, lang){
    if (Array.isArray(a)) { assert(Array.isArray(b) && b.length === a.length, `${lang}${path} : longueur`); a.forEach((x, i) => sameShape(x, b[i], `${path}[${i}]`, lang)); return; }
    if (a && typeof a === 'object') { for (const k in a) { assert(b && k in b, `${lang}${path}.${k} manquant`); sameShape(a[k], b[k], `${path}.${k}`, lang); } return; }
    assert(typeof b === typeof a && (typeof b !== 'string' || b.trim()), `${lang}${path} vide ou mal typé`);
  }
  test('Chaque langue a exactement la structure du français', () => { for (const l in I18N) sameShape(I18N.fr, I18N[l], '', l); });
  test('Aucun texte d’interface ou de contenu resté en français', () => {
    // Mots identiques légitimes d'une langue à l'autre
    const ALLOW = new Set(['de:sections.profile']);
    for (const l in I18N) { if (l === 'fr') continue;
      for (const k in I18N.fr) if (typeof I18N.fr[k] === 'string') assert(I18N[l][k] !== I18N.fr[k] || ALLOW.has(`${l}:${k}`), `${l}.${k} en français`);
      for (const grp of ['labels', 'sections']) for (const k in I18N.fr[grp])
        assert(I18N[l][grp][k] !== I18N.fr[grp][k] || ALLOW.has(`${l}:${grp}.${k}`), `${l}.${grp}.${k} en français`);
      for (const f of ['summaries', 'love', 'career']) for (const s of SIGN_ORDER) assert(I18N[l][f][s] !== I18N.fr[f][s], `${l}.${f}.${s} en français`);
      for (const s of SIGN_ORDER) for (let i = 0; i < 3; i++) assert(I18N[l].decanTraits[s][i][1] !== I18N.fr.decanTraits[s][i][1], `${l} décan ${s} ${i + 1} en français`);
    }
  });
  test('Chaque description de décan nomme sa planète et a 3 traits', () => {
    for (const l in I18N) for (const s of SIGN_ORDER) for (let i = 0; i < 3; i++) {
      const name = I18N[l].rulers[decanRuler(s, i)];
      const needle = l === 'ru' ? name.slice(0, Math.min(4, name.length - 1)) : name;   // le russe décline les noms
      const [traits, desc] = I18N[l].decanTraits[s][i];
      assert(desc.includes(needle), `${l} ${s} décan ${i + 1} ne nomme pas ${name}`);
      assert(traits.length === 3, `${l} ${s} décan ${i + 1} : ${traits.length} traits`);
    }
  });

  /* ---------------- Zodiaque chinois ---------------- */
  section('Zodiaque chinois');
  test('Dates connues du Nouvel An chinois', () => {
    for (const [y, m, d] of [[1900,1,31],[1916,2,3],[1990,1,27],[2000,2,5],[2024,2,10],[2025,1,29],[2026,2,17],[2034,2,19],[2100,2,9]]) {
      const l = lunarNewYear(y);
      assert(l && l.m === m && l.d === d, `${y} : ${l ? l.m + '/' + l.d : 'absent'}, attendu ${m}/${d}`);
    }
  });
  test('Table du Nouvel An complète et cohérente (1900-2101)', () => {
    let prev = null;
    for (let y = 1900; y <= 2101; y++) {
      const l = lunarNewYear(y);
      assert(l, `${y} absent`);
      assert((l.m === 1 && l.d >= 20) || (l.m === 2 && l.d <= 21), `${y} : ${l.m}/${l.d} hors du 20 janvier – 21 février`);
      const ms = Date.UTC(y, l.m - 1, l.d);
      if (prev) { const days = (ms - prev) / 864e5; assert((days >= 353 && days <= 355) || (days >= 383 && days <= 385), `${y - 1}→${y} : ${days} jours`); }
      prev = ms;
    }
  });
  test('Année, animal, élément et polarité', () => {
    const cases = [['1990-04-15', 1990, 'horse', 'metal', true], ['1990-01-26', 1989, 'snake', 'earth', false],
      ['2026-02-16', 2025, 'snake', 'wood', false], ['2026-02-17', 2026, 'horse', 'fire', true],
      ['2000-02-05', 2000, 'dragon', 'metal', true], ['1984-03-01', 1984, 'rat', 'wood', true]];
    for (const [iso, year, animal, element, yang] of cases) {
      const c = chineseYearInfo(parseISODate(iso));
      assert(c && c.year === year && c.animal === animal && c.element === element && c.yang === yang,
        `${iso} : ${c ? [c.year, c.animal, c.element, c.yang].join(' ') : 'null'}`);
    }
    assert(chineseYearInfo(parseISODate('1899-06-01')) === null && chineseYearInfo(parseISODate('1900-01-15')) === null, 'hors plage');
  });
  test('Cycle de 60 ans : la polarité de l’année suit toujours celle de l’animal', () => {

  test('Relations conformes aux règles du cycle des 12 branches', () => {
    // Vérification indépendante des listes : opposition = 6 branches d'écart, harmonie = somme ≡ 1 (mod 12),
    // triade = même reste modulo 4, nuisance = somme ≡ 7 (mod 12)
    for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) {
      if (i === j) continue;
      const a = CN_ORDER[i], b = CN_ORDER[j], rel = cnRelation(a, b);
      let expected;
      if (Math.abs(i - j) === 6) expected = 'clash';
      else if ((i + j) % 12 === 1) expected = 'harmony';
      else if (i % 4 === j % 4) expected = 'triad';
      else if ((i + j) % 12 === 7) expected = 'harm';
      if (expected) assert(rel === expected, `${a}+${b} : ${rel}, attendu ${expected}`);
      else assert(rel === 'punishment' || rel === 'neutral', `${a}+${b} : ${rel}`);
      assert(cnRelation(a, b) === cnRelation(b, a), `${a}+${b} asymétrique`);
    }
    for (const [a, b, rel] of [['ox','dog','punishment'],['rat','rabbit','punishment'],['dragon','dragon','selfPunish'],['rat','rat','same'],['snake','monkey','harmony']])
      assert(cnRelation(a, b) === rel, `${a}+${b} : ${cnRelation(a, b)}, attendu ${rel}`);
  });

    'color:#f0eaff;font:13px/1.5 system-ui,sans-serif;box-shadow:0 20px 40px rgba(0,0,0,.6)';
  let html = `<strong style="font-size:15px;color:${failed.length ? '#ff5470' : '#7de6a0'}">` +
    (failed.length ? `${failed.length} test(s) en échec sur ${results.length}` : `Les ${results.length} tests passent`) + '</strong>';
  let last = '';
  for (const r of results) {
    if (r.group !== last) { html += `<div style="margin-top:.7rem;color:#e8c36a;font-weight:600">${r.group}</div>`; last = r.group; }

  }
  panel.innerHTML = html;

/* ---------- Position du Soleil ----------
   Le signe et le décan dépendent de la longitude écliptique du Soleil, pas d'un calendrier fixe :

   Algorithme : J. Meeus, « Astronomical Algorithms », chap. 25. Écart max mesuré contre astropy
   sur 1900-2100 : 0,009°, soit environ 13 minutes sur l'heure d'entrée dans un signe. */
const DEG = Math.PI / 180;
function norm360(x){ return ((x % 360) + 360) % 360; }

/* Longitude écliptique apparente du Soleil, en degrés (0° = point vernal), à un instant en ms UTC */
function sunLongitude(ms){
  const T = (ms / 86400000 + 2440587.5 - 2451545.0) / 36525;   // siècles juliens depuis J2000
  const L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;        // longitude moyenne
  const M  = (357.52911 + 35999.05029*T - 0.0001537*T*T) * DEG; // anomalie moyenne
  const C  = (1.914602 - 0.004817*T - 0.000014*T*T) * Math.sin(M)

           + 0.000289 * Math.sin(3*M);                          // équation du centre
  const omega = (125.04 - 1934.136*T) * DEG;                    // nutation + aberration
  return norm360(L0 + C - 0.00569 - 0.00478*Math.sin(omega));
}

  const r = /^(\d{2}):(\d{2})/.exec(str || '');

  const h = +r[1], min = +r[2];
  return (h < 24 && min < 60) ? { h, min } : null;

    group(days, i => retroOf(i) || null).forEach(r => result.retro.push({ body, from: r.from, to: r.to }));
  }
  return result;
}
/* Regroupe les jours consécutifs de même valeur non nulle : [{value, from, to}] */
function group(days, valueOf){
  const out = [];
  for (let i = 0; i < days; i++) {
    const v = valueOf(i);
    if (!v) continue;
    const last = out[out.length - 1];
    if (last && last.value === v && last.to === i - 1) last.to = i; else out.push({ value: v, from: i, to: i });
  }
  return out;
}

/* Nouvelle Lune, premier quartier, pleine Lune, dernier quartier entre deux instants (ms UTC) */
const LUNAR_EVENTS = [[0, 'new'], [90, 'firstQuarter'], [180, 'full'], [270, 'lastQuarter']];
function lunarEvents(startMs, endMs){
  const out = [], step = 6 * 3600e3;
  const elong = ms => norm360(moonLongitude(ms) - sunLongitude(ms));
  for (const [target, type] of LUNAR_EVENTS) {
    const off = ms => norm360(elong(ms) - target + 180) - 180;   // passe de négatif à positif à l'événement
    for (let t = startMs; t < endMs; t += step) {
      let a = t, b = Math.min(t + step, endMs);
      if (off(a) < 0 && off(b) >= 0 && off(b) - off(a) < 90) {
        for (let k = 0; k < 30; k++) { const m = (a + b) / 2; if (off(m) < 0) a = m; else b = m; }
        out.push({ type, ms: (a + b) / 2 });
      }
    }
  }
  return out.sort((x, y) => x.ms - y.ms);
}

/* ---------- Compatibilité à deux ----------
   Personne = { date: {y, m, d}, time: {h, min} | null }. Trois axes, notés de 1 à 5 :
   signes solaires (matrice AFF), animaux chinois (relations traditionnelles), Lunes (matrice AFF sur les
   signes lunaires, seulement si les deux sont certains). L'entente globale est la moyenne des axes disponibles. */
function personChart(date, time, tz){
  return { sign: computeSky(date, time, tz).sign, cn: chineseYearInfo(date), moon: natalMoon(date, time, tz) };
}
function compatibility(p1, p2){
  const a = personChart(p1.date, p1.time, p1.tz), b = personChart(p2.date, p2.time, p2.tz);
  const west = { a: a.sign, b: b.sign, score: AFF[a.sign][b.sign] };
  const cn = a.cn && b.cn
    ? { a: a.cn.animal, b: b.cn.animal, rel: cnRelation(a.cn.animal, b.cn.animal), score: cnScore(a.cn.animal, b.cn.animal) }
    : null;
  const moonKnown = a.moon.signs.length === 1 && b.moon.signs.length === 1;
  const moon = moonKnown ? { a: a.moon.signs[0], b: b.moon.signs[0], score: AFF[a.moon.signs[0]][b.moon.signs[0]] } : null;
  const scores = [west, cn, moon].filter(Boolean).map(x => x.score);
  return { west, cn, moon, moonUnknown: !moonKnown, avg: scores.reduce((s, x) => s + x, 0) / scores.length };
}

<script>
/* ============================================================
   Zodiaque & Décans — carte du ciel
   Coordonnées équatoriales, temps sidéral, hauteur et azimut, projection, étoiles filantes, éclipses.
   Fonctions pures, sans DOM. Dépend de zodiac-sky-data.js, zodiac-astro.js et zodiac-planets.js.
   ============================================================ */

/* Obliquité moyenne de l'écliptique (degrés) */
function obliquity(T){ return 23.4392911 - 0.0130042 * T; }

/* Écliptique (λ, β) → équatorial (α, δ), en degrés, pour l'obliquité eps */
function eclToEq(lon, lat, eps){
  const l = lon * DEG, b = lat * DEG, e = eps * DEG;
  const ra = Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l)) / DEG;
  const dec = Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l)) / DEG;
  return [norm360(ra), dec];
}
/* Équatorial → écliptique */
function eqToEcl(ra, dec, eps){
  const a = ra * DEG, d = dec * DEG, e = eps * DEG;
  const lon = Math.atan2(Math.sin(a) * Math.cos(e) + Math.tan(d) * Math.sin(e), Math.cos(a)) / DEG;
  const lat = Math.asin(Math.sin(d) * Math.cos(e) - Math.cos(d) * Math.sin(e) * Math.sin(a)) / DEG;
  return [norm360(lon), lat];
}
/* Coordonnées J2000 d'une étoile → équinoxe de la date (précession en longitude écliptique) */
function precessFromJ2000(ra, dec, T){
  const [lon, lat] = eqToEcl(ra, dec, obliquity(0));
  return eclToEq(lon + 1.396971 * T + 0.0003086 * T * T, lat, obliquity(T));
}
/* Position équatoriale d'un astre à la date (degrés) */
function bodyEquatorial(body, ms){
  return eclToEq(bodyLongitude(body, ms), bodyLatitude(body, ms), obliquity(julianCenturies(ms)));
}

/* Temps sidéral moyen de Greenwich (degrés) — Meeus, éq. 12.4 */
function gmst(ms){
  const jd = ms / 86400000 + 2440587.5, T = (jd - 2451545.0) / 36525;
  return norm360(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000);
}
/* Hauteur et azimut (degrés ; azimut compté depuis le nord vers l'est), sans réfraction */
function altAz(ra, dec, lat, lon, ms){
  const H = (gmst(ms) + lon - ra) * DEG, d = dec * DEG, p = lat * DEG;
  const alt = Math.asin(Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H)) / DEG;
  const az = Math.atan2(-Math.cos(d) * Math.sin(H), Math.sin(d) * Math.cos(p) - Math.cos(d) * Math.sin(p) * Math.cos(H)) / DEG;
  return { alt, az: norm360(az) };
}
/* Hauteur et azimut d'un astre ; pour la Lune, correction de parallaxe (vue depuis la surface, pas du centre de la Terre) */
function bodyAltAz(body, lat, lon, ms){
  const [ra, dec] = bodyEquatorial(body, ms);
  const h = altAz(ra, dec, lat, lon, ms);
  if (body === 'moon') h.alt -= 0.9507 * Math.cos(h.alt * DEG);
  return h;
}

/* Projection stéréographique centrée sur le zénith : horizon = cercle de rayon R, nord en haut,
   est à gauche (comme en regardant le ciel au-dessus de soi) */
function projectSky(alt, az, R){
  const r = R * Math.tan((90 - alt) * DEG / 2);
  return [-r * Math.sin(az * DEG), -r * Math.cos(az * DEG)];
}
/* Direction cardinale (0 = N, 1 = NE … 7 = NO) */
function compassIndex(az){ return Math.round(norm360(az) / 45) % 8; }

/* ---------- Étoiles filantes ---------- */
const md = (m, d) => m * 100 + d;   // mois-jour comparable
/* Pluies actives à une date (gère celles qui chevauchent le 1er janvier, comme les Quadrantides) */
function activeShowers(date){
  const x = md(date.m, date.d);
  return Object.keys(METEOR_SHOWERS).filter(k => {
    const s = METEOR_SHOWERS[k], a = md(...s.start), b = md(...s.end);
    return a <= b ? (x >= a && x <= b) : (x >= a || x <= b);
  });
}
/* Prochain pic à partir d'une date (le jour même compris) : {key, date:{y,m,d}} */
function nextShowerPeak(date){
  const x = md(date.m, date.d);
  let best = null;
  for (const k of Object.keys(METEOR_SHOWERS)) {
    const [m, d] = METEOR_SHOWERS[k].peak, y = md(m, d) >= x ? date.y : date.y + 1;
    const key = y * 10000 + md(m, d);
    if (!best || key < best.sortKey) best = { key: k, date: { y, m, d }, sortKey: key };
  }
  return best;
}

/* ---------- Éclipses ---------- */
const SOLAR_ECLIPSES = 'TAHP';
/* Prochaines éclipses à partir d'un instant (ms UTC) */
function nextEclipses(ms, count){
  const minutes = ms / 60000;
  return ECLIPSES.filter(e => e[0] >= minutes).slice(0, count).map(([m, type]) => ({ ms: m * 60000, type, solar: SOLAR_ECLIPSES.includes(type) }));
}
/* Une éclipse de Lune est visible si la Lune est au-dessus de l'horizon au maximum */
function lunarEclipseVisible(ms, lat, lon){ return bodyAltAz('moon', lat, lon, ms).alt > 0; }

<script>
/* ============================================================
   Zodiaque & Décans — thème natal
   Heure locale du lieu de naissance → temps universel, ascendant, Milieu du Ciel, maisons (Placidus),
   maison de chaque astre, aspects. Fonctions pures, sans DOM.
   Dépend de zodiac-data.js, zodiac-sky-data.js (CITIES), zodiac-astro.js, zodiac-planets.js, zodiac-skymap.js.
   ============================================================ */

/* ---------- Fuseau horaire du lieu de naissance ----------
   Le navigateur contient l'historique mondial des changements d'heure (base IANA) : à partir du fuseau
   officiel d'une ville (« Europe/Paris »), on retrouve le décalage exact à n'importe quelle date
   (heure d'été, changements de fuseau, heure locale d'avant 1911…). */
const tzFormatters = {};
function tzParts(ms, tz){
  const f = tzFormatters[tz] || (tzFormatters[tz] = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', era: 'short'
  }));
  const p = {};
  for (const { type, value } of f.formatToParts(new Date(ms))) p[type] = value;
  const year = p.era === 'BC' || p.era === 'B' ? 1 - +p.year : +p.year;
  return { y: year, m: +p.month, d: +p.day, h: +p.hour, min: +p.minute, s: +p.second };
}
/* Décalage du fuseau (ms) à un instant donné : heure locale − temps universel */
function tzOffset(ms, tz){
  const p = tzParts(ms, tz);
  const asUtc = new Date(0);
  asUtc.setUTCFullYear(p.y, p.m - 1, p.d);
  asUtc.setUTCHours(p.h, p.min, p.s, 0);
  return asUtc.getTime() - Math.floor(ms / 1000) * 1000;
}
/* Heure locale d'un lieu → instant UTC (ms). Heure inexistante (passage à l'heure d'été) : décalée d'autant ;
   heure ambiguë (retour à l'heure d'hiver) : première occurrence. */
function zonedInstant(date, h, min, tz){
  const wall = new Date(0);
  wall.setUTCFullYear(date.y, date.m - 1, date.d);
  wall.setUTCHours(h, min, 0, 0);
  const w = wall.getTime();
  // Décalages possibles autour de cette date ; on garde ceux qui redonnent bien l'heure locale demandée
  const offsets = new Set([tzOffset(w - 86400e3, tz), tzOffset(w, tz), tzOffset(w + 86400e3, tz)]);
  const valid = [...offsets].map(o => w - o).filter(t => tzOffset(t, tz) === w - t).sort((a, b) => a - b);
  if (valid.length) return valid[0];                  // heure ambiguë : première occurrence
  return w - tzOffset(w - 86400e3, tz);               // heure inexistante : décalage d'avant le changement
}
/* Ville de naissance (nom tel que dans CITIES) → { name, country, lat, lon, tz } ou null */
function birthPlace(name){
  const c = CITIES.find(x => x[0] === name);
  return c ? { name: c[0], country: c[1], lat: c[2], lon: c[3], tz: c[4] } : null;
}

/* ---------- Angles et maisons ---------- */
/* Temps sidéral local (degrés) = ascension droite du Milieu du Ciel */
function ramcAt(ms, lon){ return norm360(gmst(ms) + lon); }
/* Milieu du Ciel : point de l'écliptique au méridien */
function midheaven(ramc, eps){
  return norm360(Math.atan2(Math.sin(ramc * DEG), Math.cos(ramc * DEG) * Math.cos(eps * DEG)) / DEG);
}
/* Ascendant : point de l'écliptique qui se lève à l'horizon est */
function ascendant(ramc, eps, lat){
  const r = ramc * DEG, e = eps * DEG, p = lat * DEG;
  return norm360(Math.atan2(Math.cos(r), -(Math.sin(r) * Math.cos(e) + Math.tan(p) * Math.sin(e))) / DEG);
}
/* Point de l'écliptique d'ascension droite donnée */
function eclipticFromRA(ra, eps){ return norm360(Math.atan2(Math.sin(ra * DEG), Math.cos(ra * DEG) * Math.cos(eps * DEG)) / DEG); }

/* Maisons Placidus : chaque pointe intermédiaire est le point de l'écliptique dont l'angle horaire vaut
   1/3 ou 2/3 de son demi-arc (diurne au-dessus de l'horizon, nocturne en dessous). Résolu par itération.
   Renvoie null si la méthode est impossible (cercle polaire : certains points ne se lèvent ni ne se couchent). */
function placidusCusps(ramc, eps, lat){
  const asc = ascendant(ramc, eps, lat), mc = midheaven(ramc, eps);
  const tp = Math.tan(lat * DEG), se = Math.sin(eps * DEG);
  const cusp = (fraction, below) => {
    let lon = below ? norm360(mc + 180 - 90 * fraction) : norm360(mc + 90 * fraction);   // première estimation
    for (let k = 0; k < 50; k++) {
      const dec = Math.asin(se * Math.sin(lon * DEG));
      const x = -tp * Math.tan(dec);
      if (Math.abs(x) > 1) return null;
      const dsa = Math.acos(x) / DEG;                 // demi-arc diurne
      const ra = below ? ramc + 180 - fraction * (180 - dsa) : ramc + fraction * dsa;
      const next = eclipticFromRA(norm360(ra), eps);
      if (Math.abs(((next - lon + 540) % 360) - 180) < 1e-9) { lon = next; break; }
      lon = next;
    }
    return lon;
  };
  // 11 et 12 au-dessus de l'horizon (du MC vers l'ascendant) ; 2 et 3 en dessous (de l'ascendant vers le fond du ciel)
  const c11 = cusp(1 / 3, false), c12 = cusp(2 / 3, false), c2 = cusp(2 / 3, true), c3 = cusp(1 / 3, true);
  if ([c11, c12, c2, c3].some(v => v === null)) return null;
  // Maisons 5 à 9 : opposées à 11, 12, 1, 2, 3
  return [asc, c2, c3, norm360(mc + 180), norm360(c11 + 180), norm360(c12 + 180), norm360(asc + 180), norm360(c2 + 180), norm360(c3 + 180), mc, c11, c12];
}
/* Maisons égales : 30° chacune à partir de l'ascendant (repli au-delà du cercle polaire) */
function equalCusps(asc){ return Array.from({ length: 12 }, (_, i) => norm360(asc + 30 * i)); }
/* Maison (1 à 12) d'une longitude, d'après les 12 pointes */
function houseOf(lon, cusps){
  for (let i = 0; i < 12; i++) {
    const a = cusps[i], b = cusps[(i + 1) % 12];
    const span = norm360(b - a), off = norm360(lon - a);
    if (off < span) return i + 1;
  }
  return 12;
}

/* ---------- Aspects ---------- */
const ASPECTS = [ // [nom, angle, orbe en degrés]
  ['conjunction', 0, 8], ['sextile', 60, 5], ['square', 90, 7], ['trine', 120, 7], ['opposition', 180, 8]
];
function aspectsBetween(positions){
  const out = [];
  for (let i = 0; i < positions.length; i++) for (let j = i + 1; j < positions.length; j++) {
    let d = Math.abs(positions[i].lon - positions[j].lon) % 360;
    if (d > 180) d = 360 - d;
    for (const [type, angle, orb] of ASPECTS) {
      if (Math.abs(d - angle) <= orb) { out.push({ a: positions[i].body, b: positions[j].body, type, orb: Math.abs(d - angle) }); break; }
    }
  }
  return out.sort((x, y) => x.orb - y.orb);
}

/* ---------- Thème natal complet ----------
   date {y,m,d} ; time {h,min} ou null ; place (birthPlace) ou null.
   Sans heure : positions à midi, ni ascendant ni maisons (la Lune peut alors être imprécise).
   Sans lieu : heure interprétée dans le fuseau de l'appareil, ni ascendant ni maisons. */
function natalChart(date, time, place){
  const exact = !!(time && place);
  const ms = place ? zonedInstant(date, time ? time.h : 12, time ? time.min : 0, place.tz)
                   : localInstant(date, time ? time.h : 12, time ? time.min : 0);
  const bodies = BODIES.map(body => {
    const lon = bodyLongitude(body, ms);
    return { body, lon, sign: signFromLongitude(lon), retro: isRetrograde(body, ms) };
  });
  const chart = { ms, exact, bodies, asc: null, mc: null, cusps: null, system: null, aspects: aspectsBetween(bodies) };
  if (exact) {
    const eps = obliquity(julianCenturies(ms)), ramc = ramcAt(ms, place.lon);
    chart.asc = ascendant(ramc, eps, place.lat);
    chart.mc = midheaven(ramc, eps);
    const pl = Math.abs(place.lat) < 66 ? placidusCusps(ramc, eps, place.lat) : null;
    chart.cusps = pl || equalCusps(chart.asc);
    chart.system = pl ? 'placidus' : 'equal';
    for (const b of bodies) b.house = houseOf(b.lon, chart.cusps);
  }
  return chart;
}

<script>
/* ============================================================
   Zodiaque & Décans — application
   État, thème, animation, rendu, modale, actions, initialisation. Chargé en dernier.
   ============================================================ */

/* Version autonome (fichier unique, attribut data-standalone posé par build-standalone.py) :
   copie vierge de la page, prise ici, avant toute modification, pour pouvoir se retélécharger.
   Elle ne contient aucune donnée personnelle : nom, historique et lieu restent dans le navigateur. */
const PRISTINE_PAGE = document.documentElement.dataset.standalone
  ? { head: document.head.innerHTML, body: document.body.innerHTML }
  : null;

/* ============================================================
   1. ÉTAT GLOBAL
   ============================================================ */
let currentLang = 'fr';
let currentSignKey = null;
let currentDecanIdx = 0;
let currentDate = null;
let currentTime = null;    // "HH:MM" ou null
let currentName = '';      // prénom ou nom facultatif, gardé sur l'appareil uniquement (jamais dans l'URL)
let currentSky = null;     // résultat de computeSky()
let currentCn = null;      // résultat de chineseYearInfo(), null hors 1900-2100
let skyDate = null;        // date de lecture de l'horoscope ("AAAA-MM-JJ"), aujourd'hui par défaut
let skyPeriod = 'day';     // 'day' ou 'week'
let isSearching = false;   // empêche deux animations simultanées (Entrée pressée deux fois)
let lastFocus = null;      // élément à re-focaliser à la fermeture de la modale

/* Le nom est saisi librement : on l'échappe avant de l'insérer dans du HTML */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
/* "Joann Dupré" → "joann-dupre" (nom de fichier de l'export) ; vide si aucun caractère latin */
function slugify(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

/* localStorage peut lever une exception (navigation privée, iframe sandboxée, file:// selon le navigateur) */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
  remove(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ============================================================
   2. THÈME DYNAMIQUE
   ============================================================ */
/* Mode clair / sombre : la couleur du signe est assombrie en mode clair pour rester lisible
   (contraste ≥ 4,5:1 sur le fond, vérifié par les tests). --gold-bright garde la couleur vive pour le ciel nocturne. */
let themeColors = null;   // palette du signe affiché, null = palette par défaut
const LIGHT_SHADE = { gold: 0.48, purple: 0.4 };
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  return '#' + [16, 8, 0].map(s => Math.round(((n >> s) & 255) * (1 - f)).toString(16).padStart(2, '0')).join('');
}
function isLight(){ return document.documentElement.dataset.theme === 'light'; }
function paintTheme(){
  const base = themeColors || { gold: '#e8c36a', purple: '#9b7ede' }, light = isLight();
  const gold = light ? shade(base.gold, LIGHT_SHADE.gold) : base.gold;
  const purple = light ? shade(base.purple, LIGHT_SHADE.purple) : base.purple;
  const st = document.documentElement.style;
  st.setProperty('--gold', gold);
  st.setProperty('--purple', purple);

function applyTheme(signKey){

function resetTheme(){ themeColors = null; paintTheme(); }
function setMode(mode){

  // gardaient près d'une seconde les couleurs de l'autre mode

function updateThemeButton(){

function hexToRgba(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);

/* ============================================================
   3. ANIMATION DE RECHERCHE
   ============================================================ */
function prefersReducedMotion(){
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function runSearch(signKey, onDone){

    crosshair.style.left = '50%';
    crosshair.style.top = '50%';
    crosshair.style.transform = 'translate(-50%,-50%) scale(1.5)';
    searchText.textContent = t.found + ' · ' + t.signNames[signKey];

    setTimeout(() => {
      drawConstellation(signKey);
      crosshair.style.opacity = '0';
      setTimeout(() => {
        overlay.classList.add('fade-out');
        setTimeout(() => {
          overlay.classList.add('hidden');
          overlay.setAttribute('aria-hidden','true');
          onDone();
        }, 380);
      }, 1500);
    }, 480);
  }, 1400);
}

function drawConstellation(signKey){
  const svg = document.getElementById('constSvg');
  const data = CONST[signKey];
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  data.stars.forEach(([x,y], i) => {
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',2.6);
    c.setAttribute('class','const-star');
    c.style.animationDelay = (i*0.07) + 's';
    svg.appendChild(c);
  });
  data.lines.forEach(([a,b], i) => {
    const [x1,y1] = data.stars[a], [x2,y2] = data.stars[b];
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`);
    p.setAttribute('class','const-line');
    p.setAttribute('pathLength','100');
    p.style.animationDelay = (0.25 + i*0.14) + 's';
    svg.appendChild(p);
  });
}
