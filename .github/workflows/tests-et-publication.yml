# Zodiaque & Décans — à chaque modification : tests (Chromium et Safari), puis publication du site sur GitHub Pages s'ils passent.
name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (5 fuseaux, 3 langues, hors ligne, site installable, accessibilité)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer Playwright et Chromium
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Installer l'outil d'audit d'accessibilité (axe-core, utilisé seulement pendant les tests)
        run: npm install --no-save --no-package-lock --prefix tools axe-core@4.10.2
      - name: Assembler la version autonome et le site
        run: python build-standalone.py
      - name: Lancer tous les tests
        run: python tools/run_tests.py
      - name: Préparer le site pour la publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  safari:
    # Bloquant depuis le 2 novembre 2026 : mêmes tests dans le moteur de Safari (WebKit).
    # Un échec empêche la publication, comme pour les tests Chromium.
    name: Tests — Safari (WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer Playwright et WebKit
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps webkit
      - name: Assembler la version autonome et le site
        run: python build-standalone.py
      - name: Lancer les tests dans WebKit
        run: python tools/run_tests.py --browser webkit

  firefox:
    # Informatif : mêmes tests dans Firefox.
    # Un échec s'affiche en rouge sur cette ligne, mais n'empêche jamais la publication.
    name: Informatif — Firefox
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer Playwright et Firefox
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps firefox
      - name: Assembler la version autonome et le site
        run: python build-standalone.py
      - name: Lancer les tests dans Firefox
        run: python tools/run_tests.py --browser firefox

  publication:
    name: Publication sur GitHub Pages
    needs: [tests, safari]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
