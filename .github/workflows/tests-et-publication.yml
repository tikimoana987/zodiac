# Zodiaque & Décans — à chaque modification : tests, puis publication du site sur GitHub Pages s'ils passent.
name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (5 fuseaux, 3 langues, hors ligne, site installable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer Playwright et Chromium
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Assembler la version autonome et le site
        run: python build-standalone.py
      - name: Lancer tous les tests
        run: python tools/run_tests.py
      - name: Préparer le site pour la publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publication:
    name: Publication sur GitHub Pages
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
